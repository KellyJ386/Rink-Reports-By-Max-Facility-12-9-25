apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mfo-production

namePrefix: prod-

resources:
  - ../../base
  - resources/

commonLabels:
  environment: production

commonAnnotations:
  app.kubernetes.io/managed-by: "argocd"

images:
  - name: mfo/web
    newTag: v1.0.0
  - name: mfo/worker
    newTag: v1.0.0

patches:
  # Production replicas
  - target:
      kind: Deployment
      name: mfo-web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 5
  - target:
      kind: Deployment
      name: mfo-worker
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3

  # Production resource limits
  - target:
      kind: Deployment
      name: mfo-web
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"

  # Production HPA settings
  - target:
      kind: HorizontalPodAutoscaler
      name: mfo-web-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 5
      - op: replace
        path: /spec/maxReplicas
        value: 50

  # Production PDB
  - target:
      kind: PodDisruptionBudget
      name: mfo-web-pdb
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 3

  # Update ingress host for production
  - target:
      kind: Ingress
      name: mfo-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: app.maxfacility.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: app.maxfacility.com

configMapGenerator:
  - name: mfo-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=warn
      - ENABLE_ANALYTICS=true

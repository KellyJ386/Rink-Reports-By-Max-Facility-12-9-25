apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mfo-dev

namePrefix: dev-

resources:
  - ../../base

commonLabels:
  environment: development

patches:
  # Reduce replicas for development
  - target:
      kind: Deployment
      name: mfo-web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: mfo-worker
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  # Reduce resource limits for development
  - target:
      kind: Deployment
      name: mfo-web
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

  # Disable HPA for development
  - target:
      kind: HorizontalPodAutoscaler
      name: mfo-web-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2

  # Update ingress host for development
  - target:
      kind: Ingress
      name: mfo-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: dev.maxfacility.local
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev.maxfacility.local

configMapGenerator:
  - name: mfo-config
    behavior: merge
    literals:
      - NODE_ENV=development
      - LOG_LEVEL=debug

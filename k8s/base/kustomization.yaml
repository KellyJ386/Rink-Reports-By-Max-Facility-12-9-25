apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: mfo-base

namespace: mfo

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - network-policy.yaml

commonLabels:
  app.kubernetes.io/name: max-facility-operations
  app.kubernetes.io/part-of: mfo

configMapGenerator: []

secretGenerator: []

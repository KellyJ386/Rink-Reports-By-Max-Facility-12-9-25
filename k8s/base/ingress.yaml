apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mfo-ingress
  namespace: mfo
  labels:
    app.kubernetes.io/name: max-facility-operations
  annotations:
    # NGINX Ingress Controller
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # TLS with cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Enable CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.maxfacility.com"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.maxfacility.com
        - api.maxfacility.com
      secretName: mfo-tls-secret
  rules:
    - host: app.maxfacility.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mfo-web
                port:
                  number: 80
    - host: api.maxfacility.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mfo-web
                port:
                  number: 80
---
# Alternative: AWS ALB Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mfo-ingress-alb
  namespace: mfo
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:xxx:certificate/xxx
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
spec:
  ingressClassName: alb
  rules:
    - host: app.maxfacility.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mfo-web
                port:
                  number: 80

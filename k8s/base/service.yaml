apiVersion: v1
kind: Service
metadata:
  name: mfo-web
  namespace: mfo
  labels:
    app.kubernetes.io/name: max-facility-operations
    app.kubernetes.io/component: web
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: max-facility-operations
    app.kubernetes.io/component: web
---
# Headless service for StatefulSet if needed
apiVersion: v1
kind: Service
metadata:
  name: mfo-web-headless
  namespace: mfo
  labels:
    app.kubernetes.io/name: max-facility-operations
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: max-facility-operations
    app.kubernetes.io/component: web

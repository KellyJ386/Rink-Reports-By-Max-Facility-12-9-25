apiVersion: v1
kind: Secret
metadata:
  name: mfo-secrets
  namespace: mfo
  labels:
    app.kubernetes.io/name: max-facility-operations
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database - Replace with actual values or use external secrets manager
  DATABASE_URL: "postgresql://user:password@postgres:5432/mfo"

  # Redis
  REDIS_URL: "redis://redis:6379"

  # Authentication
  NEXTAUTH_SECRET: "your-nextauth-secret-replace-me"
  NEXTAUTH_URL: "https://app.maxfacility.com"

  # JWT
  JWT_SECRET: "your-jwt-secret-replace-me"

  # Stripe (Billing)
  STRIPE_SECRET_KEY: "sk_live_xxx"
  STRIPE_WEBHOOK_SECRET: "whsec_xxx"

  # Email Service
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_USER: "apikey"
  SMTP_PASSWORD: "SG.xxx"

  # Cloud Storage
  S3_ACCESS_KEY_ID: "xxx"
  S3_SECRET_ACCESS_KEY: "xxx"
  S3_BUCKET: "mfo-uploads"
  S3_REGION: "us-east-1"

  # Push Notifications
  VAPID_PUBLIC_KEY: "xxx"
  VAPID_PRIVATE_KEY: "xxx"

  # External APIs
  GOOGLE_MAPS_API_KEY: "xxx"
---
# Note: In production, use external secrets management:
# - AWS Secrets Manager with External Secrets Operator
# - HashiCorp Vault
# - Sealed Secrets
# - SOPS

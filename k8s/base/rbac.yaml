apiVersion: v1
kind: ServiceAccount
metadata:
  name: mfo-service-account
  namespace: mfo
  labels:
    app.kubernetes.io/name: max-facility-operations
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mfo-role
  namespace: mfo
rules:
  # Allow reading configmaps and secrets
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  # Allow reading pods for health checks
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mfo-role-binding
  namespace: mfo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mfo-role
subjects:
  - kind: ServiceAccount
    name: mfo-service-account
    namespace: mfo
---
# ClusterRole for cross-namespace access (if needed)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mfo-cluster-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mfo-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mfo-cluster-role
subjects:
  - kind: ServiceAccount
    name: mfo-service-account
    namespace: mfo

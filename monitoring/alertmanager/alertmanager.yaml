# Alertmanager Configuration for MFO

global:
  # ResolveTimeout is the time after which an alert is declared resolved
  resolve_timeout: 5m

  # SMTP configuration for email alerts
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alerts@maxfacilityops.com'
  smtp_auth_username: '{{ .smtp_username }}'
  smtp_auth_password: '{{ .smtp_password }}'
  smtp_require_tls: true

  # Slack configuration
  slack_api_url: '{{ .slack_webhook_url }}'

  # PagerDuty configuration
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alert routing
route:
  # Default receiver
  receiver: 'platform-team'

  # Group alerts by these labels
  group_by: ['alertname', 'severity', 'team']

  # Wait time before sending first notification
  group_wait: 30s

  # Wait time before sending subsequent notifications
  group_interval: 5m

  # Wait time before re-sending notifications
  repeat_interval: 4h

  # Child routes for specific routing
  routes:
    # Critical alerts go to PagerDuty immediately
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    # Database team alerts
    - match:
        team: database
      receiver: 'database-team'
      routes:
        - match:
            severity: critical
          receiver: 'database-team-pagerduty'
          group_wait: 10s

    # Infrastructure team alerts
    - match:
        team: infrastructure
      receiver: 'infrastructure-team'
      routes:
        - match:
            severity: critical
          receiver: 'infrastructure-team-pagerduty'
          group_wait: 10s

    # SLA alerts go to leadership
    - match:
        sla: availability
      receiver: 'sla-alerts'
      group_wait: 10s
      repeat_interval: 30m

    # Business hours only alerts
    - match:
        severity: warning
      receiver: 'platform-team-slack'
      active_time_intervals:
        - business-hours

# Receivers define notification channels
receivers:
  # Default platform team receiver
  - name: 'platform-team'
    email_configs:
      - to: 'platform-team@maxfacilityops.com'
        send_resolved: true
    slack_configs:
      - channel: '#mfo-alerts'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        actions:
          - type: button
            text: 'View in Grafana'
            url: '{{ template "grafana.url" . }}'
          - type: button
            text: 'Runbook'
            url: '{{ template "runbook.url" . }}'

  # Platform team Slack only
  - name: 'platform-team-slack'
    slack_configs:
      - channel: '#mfo-alerts-low'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'

  # Critical alerts to PagerDuty
  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: '{{ .pagerduty_service_key }}'
        severity: critical
        description: '{{ template "pagerduty.description" . }}'
        details:
          firing: '{{ template "pagerduty.firing" . }}'
          num_firing: '{{ .Alerts.Firing | len }}'
          num_resolved: '{{ .Alerts.Resolved | len }}'

  # Database team
  - name: 'database-team'
    email_configs:
      - to: 'dba-team@maxfacilityops.com'
        send_resolved: true
    slack_configs:
      - channel: '#mfo-database-alerts'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'

  # Database team PagerDuty
  - name: 'database-team-pagerduty'
    pagerduty_configs:
      - service_key: '{{ .pagerduty_database_key }}'
        severity: critical
        description: '{{ template "pagerduty.description" . }}'

  # Infrastructure team
  - name: 'infrastructure-team'
    email_configs:
      - to: 'infrastructure@maxfacilityops.com'
        send_resolved: true
    slack_configs:
      - channel: '#mfo-infra-alerts'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'

  # Infrastructure team PagerDuty
  - name: 'infrastructure-team-pagerduty'
    pagerduty_configs:
      - service_key: '{{ .pagerduty_infra_key }}'
        severity: critical
        description: '{{ template "pagerduty.description" . }}'

  # SLA alerts to leadership
  - name: 'sla-alerts'
    email_configs:
      - to: 'leadership@maxfacilityops.com'
        send_resolved: true
      - to: 'platform-team@maxfacilityops.com'
        send_resolved: true
    slack_configs:
      - channel: '#mfo-sla-alerts'
        send_resolved: true
        title: '🚨 SLA Alert: {{ .GroupLabels.alertname }}'
        text: '{{ template "slack.sla.text" . }}'
    pagerduty_configs:
      - service_key: '{{ .pagerduty_service_key }}'
        severity: critical
        description: 'SLA Breach: {{ .GroupLabels.alertname }}'

# Inhibition rules to suppress notifications
inhibit_rules:
  # If a critical alert is firing, suppress warnings for the same alertname
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']

  # If PostgresDown is firing, suppress other Postgres alerts
  - source_match:
      alertname: 'PostgresDown'
    target_match_re:
      alertname: 'Postgres.*'
    equal: ['job']

  # If RedisDown is firing, suppress other Redis alerts
  - source_match:
      alertname: 'RedisDown'
    target_match_re:
      alertname: 'Redis.*'
    equal: ['job']

  # If node is not ready, suppress pod alerts on that node
  - source_match:
      alertname: 'NodeNotReady'
    target_match_re:
      alertname: 'MFO.*'
    equal: ['node']

# Time intervals for routing
time_intervals:
  - name: business-hours
    time_intervals:
      - weekdays: ['monday:friday']
        times:
          - start_time: '09:00'
            end_time: '18:00'
        location: 'America/New_York'

  - name: off-hours
    time_intervals:
      - weekdays: ['saturday', 'sunday']
      - weekdays: ['monday:friday']
        times:
          - start_time: '00:00'
            end_time: '09:00'
          - start_time: '18:00'
            end_time: '24:00'
        location: 'America/New_York'
